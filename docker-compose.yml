# HushVoice — self-hosted voice engine + optional web UI (no API keys)
#
# The engine service is your always-on clone/TTS server.
# The web UI (Vercel or local) talks to it via HUSHVOICE_ENGINE_URL.
#
# Usage:
#   docker compose up -d --build engine   # start the voice engine
#   npm run dev                           # start the web UI
#
# First run downloads ML models into the model-cache volume (several GB).

services:
  engine:
    # Build the HushVoice engine image (compatible FastAPI voice stack).
    # Override image/build in production as needed.
    image: hushvoice-engine:latest
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: hushvoice-engine
    restart: unless-stopped
    ports:
      - "17493:17493"
    volumes:
      - hushvoice-data:/app/data
      - hushvoice-model-cache:/home/hushvoice/.cache/huggingface
    environment:
      - LOG_LEVEL=info
      - NUMBA_CACHE_DIR=/tmp/numba_cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:17493/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G

  # Optional: run the Next.js UI in Docker too
  #   docker compose --profile full up -d --build
  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hushvoice-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - HUSHVOICE_ENGINE_URL=http://engine:17493
      - HUSHVOICE_TTS_ENGINE=chatterbox
    depends_on:
      engine:
        condition: service_healthy

volumes:
  hushvoice-data:
  hushvoice-model-cache:
